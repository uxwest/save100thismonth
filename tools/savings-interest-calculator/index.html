<!DOCTYPE html><html lang="en-US"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Savings Interest Calculator | Save100ThisMonth</title><link rel="stylesheet" href="../../assets/css/style.css"></head><body><header class="site-header"><div class="header-inner"><a class="logo" href="../../index.html">Save<b>100</b>ThisMonth</a><nav class="main-nav"><a href="../index.html">Tools</a></nav></div></header><main><article class="page"><h1>Savings Interest Calculator</h1><label>Balance<input id="p" type="number" min="0"></label><label>APY %<input id="y" type="number" min="0" max="25" step="0.01"></label><label>Months<input id="n" type="number" value="12" min="1" max="600"></label><p><button class="btn primary" id="c" style="background:#1877F2;color:#fff;border:0;padding:.7rem 1.2rem;border-radius:999px;font-weight:800">Calculate</button></p><div class="result" id="r">Enter figures.</div></article><script>document.getElementById('c').onclick=()=>{const p=parseFloat(document.getElementById('p').value),y=parseFloat(document.getElementById('y').value),n=parseInt(document.getElementById('n').value),r=document.getElementById('r');if(isNaN(p)||isNaN(y)||isNaN(n)){r.textContent='Enter valid values.';return;}const m=Math.pow(1+y/100,1/12)-1;let b=p;for(let i=0;i<n;i++)b*=1+m;r.innerHTML=`Balance ≈ <b>$${b.toFixed(2)}</b>, interest ≈ <b>$${(b-p).toFixed(2)}</b>.`};</script></main></body></html>
