<!DOCTYPE html><html lang="en-US"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Subscription Calculator | Save100ThisMonth</title><link rel="stylesheet" href="../../assets/css/style.css"></head><body><header class="site-header"><div class="header-inner"><a class="logo" href="../../index.html">Save<b>100</b>ThisMonth</a><nav class="main-nav"><a href="../index.html">Tools</a></nav></div></header><main><article class="page"><h1>Subscription Savings Calculator</h1><label>Monthly price (USD)<input id="m" type="number" min="0" step="0.01"></label><label>Annual price (USD)<input id="a" type="number" min="0" step="0.01"></label><p><button class="btn primary" id="c" style="background:#1877F2;color:#fff;border:0;padding:.7rem 1.2rem;border-radius:999px;font-weight:800">Calculate</button></p><div class="result" id="r">Enter both prices.</div><p class="meta">Formula: savings = monthly×12 − annual. Annual wins only if you keep it 12 months.</p></article><script>document.getElementById('c').onclick=()=>{const m=parseFloat(document.getElementById('m').value),a=parseFloat(document.getElementById('a').value),r=document.getElementById('r');if(isNaN(m)||isNaN(a)){r.textContent='Enter valid prices.';return;}const s=m*12-a;r.innerHTML=s>0?`Annual saves <b>$${s.toFixed(2)}/yr</b>.`:s===0?'Same cost — prefer monthly for flexibility.':`Monthly is safer: annual costs <b>$${(-s).toFixed(2)} more/yr</b>.`};</script></main></body></html>
