<!DOCTYPE html><html lang="en-US"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free Invoice Generator | Save100ThisMonth</title><link rel="stylesheet" href="../../assets/css/style.css"></head><body><header class="site-header"><div class="header-inner"><a class="logo" href="../../index.html">Save<b>100</b>ThisMonth</a><nav class="main-nav"><a href="../index.html">Tools</a></nav></div></header><main><article class="page"><h1>Free Invoice Generator (private, in-browser)</h1><label>From<input id="f"></label><label>To<input id="t"></label><label>Description<input id="d"></label><label>Amount USD<input id="a" type="number" min="0" step="0.01"></label><p><button id="c" style="background:#1877F2;color:#fff;border:0;padding:.7rem 1.2rem;border-radius:999px;font-weight:800">Build preview</button></p><div class="result" id="r">Fill fields.</div></article><script>document.getElementById('c').onclick=()=>{const f=document.getElementById('f').value,t=document.getElementById('t').value,d=document.getElementById('d').value,a=parseFloat(document.getElementById('a').value),r=document.getElementById('r');if(!f||!t||!d||isNaN(a)){r.textContent='Fill all fields.';return;}r.innerHTML=`<b>INVOICE</b><br>From ${f} → ${t}<br>${d}<br><b>Total: $${a.toFixed(2)}</b><br><span class="meta">Print → Save as PDF. Nothing uploaded.</span>`};</script></main></body></html>
