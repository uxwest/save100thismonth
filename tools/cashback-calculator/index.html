<!DOCTYPE html><html lang="en-US"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cashback Calculator | Save100ThisMonth</title><link rel="stylesheet" href="../../assets/css/style.css"></head><body><header class="site-header"><div class="header-inner"><a class="logo" href="../../index.html">Save<b>100</b>ThisMonth</a><nav class="main-nav"><a href="../index.html">Tools</a></nav></div></header><main><article class="page"><h1>Cashback Comparison Calculator</h1><label>Groceries/mo<input id="g" type="number" min="0"></label><label>Dining+gas/mo<input id="d" type="number" min="0"></label><label>Other/mo<input id="o" type="number" min="0"></label><label>Card A % (groceries/dining)<input id="ra" type="number" step="0.1"></label><label>Card B % (flat)<input id="rb" type="number" step="0.1"></label><p><button id="c" style="background:#1877F2;color:#fff;border:0;padding:.7rem 1.2rem;border-radius:999px;font-weight:800">Compare</button></p><div class="result" id="r">Enter spending.</div></article><script>document.getElementById('c').onclick=()=>{const g=+document.getElementById('g').value||0,d=+document.getElementById('d').value||0,o=+document.getElementById('o').value||0,ra=+document.getElementById('ra').value,rb=+document.getElementById('rb').value,r=document.getElementById('r');if(isNaN(ra)||isNaN(rb)){r.textContent='Enter rates.';return;}const a=(g+d)*ra/100,b=(g+d+o)*rb/100;r.innerHTML=`A: <b>$${a.toFixed(2)}/mo</b> · B: <b>$${b.toFixed(2)}/mo</b>. Yearly diff: <b>$${((a-b)*12).toFixed(2)}</b>. Subtract annual fees.`};</script></main></body></html>
