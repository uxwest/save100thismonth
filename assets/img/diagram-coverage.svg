<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 400' role='img' aria-labelledby='t'><title id='t'>Diagram: the layers of a car insurance policy, from liability at the base to optional add-ons at the top</title><rect width='800' height='400' fill='#fff'/><text x='40' y='34' font-family='Roboto,Arial,sans-serif' font-size='18' font-weight='700' fill='#101828'>The layers of a car insurance policy</text><g font-family='Roboto,Arial,sans-serif' font-size='15'><rect x='120' y='300' width='560' height='54' rx='10' fill='#101828'/><text x='140' y='333' fill='#fff' font-weight='700'>Liability: pays OTHER people</text><text x='520' y='333' fill='#98a2b3'>Legally required</text><rect x='150' y='238' width='500' height='54' rx='10' fill='#1877f2'/><text x='170' y='271' fill='#fff' font-weight='700'>Uninsured motorist: protects YOU</text><rect x='180' y='176' width='440' height='54' rx='10' fill='#4c96f7'/><text x='200' y='209' fill='#fff' font-weight='700'>Collision: your car, crashes</text><rect x='210' y='114' width='380' height='54' rx='10' fill='#84b8fb'/><text x='230' y='147' fill='#101828' font-weight='700'>Comprehensive: theft, hail, glass</text><rect x='250' y='60' width='300' height='46' rx='10' fill='#eaf2ff' stroke='#b2d0ff'/><text x='270' y='89' fill='#101828'>Add-ons: rental, roadside, gap</text></g></svg>