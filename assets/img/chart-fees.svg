<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 360' role='img' aria-labelledby='t'><title id='t'>Chart: 85 dollars of extra interest minus 60 dollars of fees leaves about 25 dollars</title><rect width='800' height='360' fill='#fff'/><text x='40' y='34' font-family='Roboto,Arial,sans-serif' font-size='18' font-weight='700' fill='#101828'>How a $5/month fee eats a $2,000 balance</text><text x='40' y='56' font-family='Roboto,Arial,sans-serif' font-size='13' fill='#667085'>Illustrative: 4.25% APY vs 0.01%, one year</text><g font-family='Roboto,Arial,sans-serif' font-size='15' fill='#344054'><text x='40' y='122'>Extra interest</text><text x='40' y='192'>Fees ($5 x 12)</text><text x='40' y='262'>What you keep</text></g><rect x='200' y='100' width='510' height='34' rx='8' fill='#1877f2'/><rect x='200' y='170' width='360' height='34' rx='8' fill='#f04438'/><rect x='200' y='240' width='149' height='34' rx='8' fill='#12b76a'/><g font-family='Roboto Mono,monospace' font-size='15' font-weight='700'><text x='720' y='123' fill='#101828'>$85</text><text x='570' y='193' fill='#101828'>$60</text><text x='360' y='263' fill='#101828'>~$25</text></g><text x='40' y='326' font-family='Roboto,Arial,sans-serif' font-size='13' fill='#667085'>A small fee can erase most of a rate advantage on a small balance.</text></svg>