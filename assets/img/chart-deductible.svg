<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 380' role='img' aria-labelledby='t'><title id='t'>Chart: saving 180 dollars a year takes about 4.2 claim-free years to recover a 750 dollar higher deductible</title><rect width='800' height='380' fill='#fff'/><text x='40' y='34' font-family='Roboto,Arial,sans-serif' font-size='18' font-weight='700' fill='#101828'>Deductible break-even: when does the bet pay off?</text><text x='40' y='56' font-family='Roboto,Arial,sans-serif' font-size='13' fill='#667085'>Illustrative: $250 to $1,000 deductible, saves $180/year</text><g stroke='#e4e7ec'><path d='M80 310H740M80 80V310'/></g><path d='M80 140H740' stroke='#f04438' stroke-width='3' stroke-dasharray='8 6'/><text x='560' y='130' font-family='Roboto,Arial,sans-serif' font-size='13' fill='#f04438'>Extra risk: $750</text><path d='M80 310L740 112' stroke='#1877f2' stroke-width='5'/><circle cx='647' cy='140' r='9' fill='#101828'/><text x='560' y='176' font-family='Roboto,Arial,sans-serif' font-size='14' font-weight='700' fill='#101828'>Break-even: ~4.2 years</text><g font-family='Roboto Mono,monospace' font-size='12' fill='#667085'><text x='76' y='332'>0</text><text x='186' y='332'>1</text><text x='296' y='332'>2</text><text x='406' y='332'>3</text><text x='516' y='332'>4</text><text x='626' y='332'>5</text><text x='726' y='332'>6 yrs</text></g><text x='100' y='290' font-family='Roboto,Arial,sans-serif' font-size='13' fill='#1877f2'>Cumulative premium saved</text></svg>