<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 400' role='img' aria-labelledby='t'><title id='t'>Chart: a 5 percent promo rate that drops to 3.5 percent after three months, versus a steady 4.3 percent rate</title><rect width='800' height='400' fill='#fff'/><text x='40' y='34' font-family='Roboto,Arial,sans-serif' font-size='18' font-weight='700' fill='#101828'>Promo APY vs steady APY, 12 months</text><text x='40' y='56' font-family='Roboto,Arial,sans-serif' font-size='13' fill='#667085'>Illustrative example. Verify live rates with each bank.</text><g stroke='#e4e7ec'><path d='M80 114H740M80 190H740M80 276H740'/></g><g font-family='Roboto Mono,monospace' font-size='12' fill='#667085'><text x='34' y='118'>5.0%</text><text x='34' y='194'>4.3%</text><text x='34' y='280'>3.5%</text><text x='76' y='356'>M1</text><text x='196' y='356'>M3</text><text x='466' y='356'>M8</text><text x='726' y='356'>M12</text></g><path d='M80 114H200V276H740' fill='none' stroke='#f04438' stroke-width='5' stroke-linejoin='round'/><path d='M80 190H740' fill='none' stroke='#1877f2' stroke-width='5'/><rect x='470' y='70' width='290' height='76' rx='10' fill='#f2f4f7'/><circle cx='490' cy='94' r='7' fill='#f04438'/><text x='504' y='99' font-family='Roboto,Arial,sans-serif' font-size='14' fill='#101828'>Promo: blended about 3.88%</text><circle cx='490' cy='124' r='7' fill='#1877f2'/><text x='504' y='129' font-family='Roboto,Arial,sans-serif' font-size='14' fill='#101828'>Steady: 4.30% all year</text></svg>